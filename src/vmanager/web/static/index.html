<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VirtUI Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>VirtUI <span>Manager</span></h1>
    <nav id="servers" aria-label="Hypervisors"></nav>
    <div class="header-right">
      <input id="filter" type="search" placeholder="Filter VMs..." autocomplete="off">
      <span id="ws-status" class="ws-dot" title="Live stats: disconnected"></span>
      <button id="token-btn" type="button" title="API token">Token</button>
    </div>
  </header>

  <main id="cards" aria-label="Virtual machines"></main>
  <p id="empty" hidden>No VMs found.</p>

  <div id="token-modal" class="modal" hidden>
    <div class="modal-box">
      <h2>API token</h2>
      <p>Enter the token printed by <code>virtui-web</code> at startup.</p>
      <input id="token-input" type="password" autocomplete="off" placeholder="Token">
      <div class="modal-actions">
        <button id="token-cancel" type="button" class="secondary">Cancel</button>
        <button id="token-save" type="button">Connect</button>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="modal" hidden>
    <div class="modal-box">
      <h2 id="confirm-title">Confirm action</h2>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" type="button" class="secondary">Cancel</button>
        <button id="confirm-ok" type="button" class="danger">Confirm</button>
      </div>
    </div>
  </div>

  <div id="detail-modal" class="modal" hidden>
    <div class="modal-box detail-box">
      <div class="detail-head">
        <span id="detail-dot" class="status-dot"></span>
        <h2 id="detail-title"></h2>
        <span id="detail-server" class="detail-server"></span>
        <button id="detail-refresh" type="button" class="secondary" title="Refresh">&#x21bb;</button>
        <button id="detail-close" type="button" class="secondary" title="Close">&#x2715;</button>
      </div>
      <nav id="detail-tabs">
        <button type="button" class="tab active" data-tab="overview">Overview</button>
        <button type="button" class="tab" data-tab="networks">Networks</button>
        <button type="button" class="tab" data-tab="disks">Disks</button>
        <button type="button" class="tab" data-tab="devices">Devices</button>
        <button type="button" class="tab" data-tab="snapshots">Snapshots</button>
        <button type="button" class="tab" data-tab="xml">XML</button>
      </nav>
      <div id="detail-content"><p class="detail-loading">Loading...</p></div>
    </div>
  </div>

  <div id="act-menu" class="popup" hidden>
    <button type="button" data-mact="console">Web Console</button>
    <button type="button" data-mact="rename">Rename...</button>
    <button type="button" data-mact="snapshots">Snapshots...</button>
    <button type="button" data-mact="xml">View XML</button>
    <button type="button" data-mact="stop-console" class="danger-item">Stop Console</button>
    <button type="button" data-mact="delete" class="danger-item">Delete...</button>
  </div>

  <div id="rename-modal" class="modal" hidden>
    <div class="modal-box">
      <h2>Rename VM</h2>
      <p>The VM must be stopped. Only letters, digits, hyphens and dots are allowed; snapshots and NVRAM are preserved.</p>
      <input id="rename-input" type="text" autocomplete="off" placeholder="New name">
      <div class="modal-actions">
        <button id="rename-cancel" type="button" class="secondary">Cancel</button>
        <button id="rename-ok" type="button">Rename</button>
      </div>
    </div>
  </div>

  <div id="delete-modal" class="modal" hidden>
    <div class="modal-box">
      <h2>Delete VM</h2>
      <p id="delete-text"></p>
      <label class="check"><input id="delete-storage" type="checkbox"> Also delete storage volume(s)</label>
      <label class="check"><input id="delete-nvram" type="checkbox"> Also delete NVRAM file</label>
      <div class="modal-actions">
        <button id="delete-cancel" type="button" class="secondary">Cancel</button>
        <button id="delete-ok" type="button" class="danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <template id="card-template">
    <article class="card">
      <div class="card-head">
        <span class="status-dot"></span>
        <span class="vm-name"></span>
        <span class="vm-status"></span>
      </div>
      <div class="vm-server"></div>
      <div class="actions"></div>
      <div class="sparks">
        <div class="spark">
          <div class="spark-label">CPU <b class="spark-value cpu-value">--</b></div>
          <canvas class="spark-canvas cpu"></canvas>
        </div>
        <div class="spark">
          <div class="spark-label">MEM <b class="spark-value mem-value">--</b></div>
          <canvas class="spark-canvas mem"></canvas>
        </div>
        <div class="spark">
          <div class="spark-label">NET <b class="spark-value net-value">--</b></div>
          <canvas class="spark-canvas net"></canvas>
        </div>
        <div class="spark">
          <div class="spark-label">DISK <b class="spark-value disk-value">--</b></div>
          <canvas class="spark-canvas disk"></canvas>
        </div>
      </div>
      <div class="card-foot">
        <span class="vm-vcpus"></span>
        <span class="vm-mem"></span>
        <span class="vm-ip"></span>
      </div>
    </article>
  </template>

  <script src="/static/sparkline.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
